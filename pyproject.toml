[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-price-prediction"
version = "2.0.0"
description = "LSTM stock price prediction with a naive baseline, live data and a Streamlit dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "numpy>=1.26",
    "yfinance>=0.2.40",
    "streamlit>=1.40",
    "plotly>=5.20",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["original"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
